name: Deploy docs

# Publish the nanus docs site (apps/website - Astro + Starlight) to
# nanus.iamstan.dev with blogwright, using the same structure and AWS accounts the
# blogwright and oidc-exchange repos use for their own docs. Docs-site changes go
# live on merge to main (path-filtered), and every GitHub release republishes so the
# docs track the release. The site is built inside blogwright's Lambda MicroVM; this
# runner only orchestrates via the blogwright CLI (a root devDependency installed
# from npm). The OIDC role and infrastructure are created out of band by
# `blogwright bootstrap production`; the sync only uploads and invalidates files that
# changed.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "config/production.jsonc"
      - ".github/workflows/production.yml"

# Queue production deploys instead of cancelling: killing a mid-run deploy leaks a
# running MicroVM and its pending job marker.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # Created by `blogwright bootstrap production` (gh-oidc-role node; trust policy
  # scoped to config.githubRepo antstanley/nanus + the `production` environment).
  ROLE_ARN: arn:aws:iam::115019372186:role/production-nanus-gh

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # assume the AWS role via OIDC
    # Scopes the OIDC token subject to `…:environment:production` (the role's trust
    # policy requires it) and gates deploys behind environment protection rules.
    environment:
      name: production
      url: https://nanus.iamstan.dev
    steps:
      # A release event checks out the release's tag commit - that revision is what
      # gets built and published.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.25.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy docs to production
        # The docs site itself is built inside the MicroVM; the runner only runs the
        # blogwright CLI installed from the frozen workspace install.
        run: pnpm exec blogwright deploy production
