name: Local transports
on:
  push:
    branches: [main, 'codex/windows-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-link:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Avoid optimized code generation while collecting native OS behavior evidence.
      CARGO_PROFILE_TEST_OPT_LEVEL: 0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Format
        run: cargo fmt --all --check
      - name: Lint both binaries and the platform implementation
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test the kernel, link, and Windows capability boundary
        if: ${{ !cancelled() }}
        run: cargo test -p nanus-kernel -p nanus-link -p nanus-sys-windows --all-features --locked
      - name: Test Unix shell lifecycle
        if: runner.os != 'Windows'
        run: cargo test -p nanus-adapter-local --test shell --locked
      - name: Test Windows shell lifecycle and grandchild cleanup
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: cargo test -p nanus-adapter-local --test windows_shell --locked
      - name: Test the interface's shell escape
        if: ${{ !cancelled() }}
        run: cargo test -p nanus-tui --lib shell:: --locked
      - name: Build both programs natively
        run: cargo build --workspace --locked
      - name: Test service endpoint configuration
        run: cargo test -p nanus-cli service::tests --locked
      - name: Test detached start, duplicate refusal, status, stop, and restart
        timeout-minutes: 2
        run: python scripts/test-local-service.py
      - name: Keep Rust unsafe forbidden in every crate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          workspace = tomllib.loads(Path('Cargo.toml').read_text())
          assert workspace['workspace']['lints']['rust']['unsafe_code'] == 'forbid'
          for member in workspace['workspace']['members']:
              manifest = tomllib.loads((Path(member) / 'Cargo.toml').read_text())
              assert manifest['lints']['workspace'], member
              crate = Path(member) / 'src/lib.rs'
              if not crate.exists():
                  crate = Path(member) / 'src/main.rs'
              assert '#![forbid(unsafe_code)]' in crate.read_text(), member
          PY
      - name: Keep the Windows binding leaf pinned and narrow
        shell: bash
        run: |
          python3 - <<'PY'
          # `bun_windows_sys` supplies one audited safe declaration; see SAFETY.md. A new version
          # or a second item from it is a new review, so either fails here rather than passing
          # unnoticed.
          import re
          from pathlib import Path
          import tomllib
          manifest = tomllib.loads(Path('crates/nanus-sys-windows/Cargo.toml').read_text())
          pin = manifest['target']['cfg(windows)']['dependencies']['bun_windows_sys']
          assert pin == '=0.1.0', pin
          lock = tomllib.loads(Path('Cargo.lock').read_text())
          versions = [p['version'] for p in lock['package'] if p['name'] == 'bun_windows_sys']
          assert versions == ['0.1.0'], versions
          used = set()
          for source in Path('crates').rglob('*.rs'):
              text = source.read_text()
              for found in re.findall(r'bun_windows_sys::\{?([^;]*?)\}?;', text):
                  used.update(name.strip().split('::')[-1] for name in found.split(','))
          assert used == {'INVALID_HANDLE_VALUE', 'SetHandleInformation'}, used
          PY
