name: Embedded library
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  caller:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        features: ["", "providers"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Test downstream library feature boundary
        run: cargo test --manifest-path examples/embedded/Cargo.toml --locked --features "${{ matrix.features }}"
      - name: Run the caller-owned host
        run: cargo run --manifest-path examples/embedded/Cargo.toml --locked --features "${{ matrix.features }}"
