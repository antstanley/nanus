[package]
name = "nanus-windows-sid-probe"
version = "0.0.0"
edition = "2024"
publish = false

# A probe, not a product: it checks that the safe `winsafe` call chain
# `docs/link-transports.md` chose for naming a pipe by the current user's SID returns a
# usable value on a real Windows host. It is outside the workspace for the same reason
# `examples/embedded` is, and now exercises the product wrapper; the wrapper also carries its own native tests.
[workspace]

# Not `[lints] workspace = true`: there is no workspace here to inherit from, so the one rule
# that matters is stated directly.
[lints.rust]
unsafe_code = "forbid"

[target.'cfg(windows)'.dependencies]
nanus-sys-windows = { path = "../../crates/nanus-sys-windows" }
