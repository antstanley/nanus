[package]
name = "nanus-sys-windows"
description = "Narrow safe Windows capabilities for nanus local transports and process lifecycle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[target.'cfg(windows)'.dependencies]
# A dependency-free Win32 binding leaf; only its audited safe SetHandleInformation
# declaration is used. Keep the version exact because that safety boundary is the API.
bun_windows_sys = "=0.1.0"
winsafe = { version = "=0.0.29", default-features = false, features = ["advapi", "kernel"] }
thiserror = { workspace = true }
tokio = { workspace = true }
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop", "creation-flags"] }
# Only for the `PROCESS_CREATION_FLAGS` value process-wrap's `CreationFlags` takes: a plain
# integer newtype and a constant, no call. Pinned to the version process-wrap already links.
windows = { version = "0.62", default-features = false, features = ["Win32_System_Threading"] }

[lints]
workspace = true
