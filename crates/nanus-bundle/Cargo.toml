[package]
name = "nanus-bundle"
description = "The plugin set that assembles a working nanus harness: tools, policy, session, and the agent loop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["stock-compose"]
stock-compose = [
    "dep:nanus-adapter-config",
    "dep:nanus-adapter-deepseek",
    "dep:nanus-adapter-openai",
    "dep:nanus-adapter-anthropic",
    "dep:nanus-adapter-secret",
    "dep:nanus-adapter-local",
    "dep:nanus-adapter-store",
    "dep:nanus-tool-video",
    "dep:toml",
]

[dependencies]
nanus-kernel = { workspace = true }
nanus-domain = { workspace = true }
nanus-ports = { workspace = true }
nanus-adapter-config = { workspace = true, optional = true }
nanus-adapter-deepseek = { workspace = true, optional = true }
# The other providers. This crate is the only one that names a concrete adapter, so
# adding a provider means an entry in the table in `provider.rs` and a dependency
# here, and nothing below changes.
nanus-adapter-openai = { workspace = true, optional = true }
nanus-adapter-anthropic = { workspace = true, optional = true }
nanus-adapter-secret = { workspace = true, optional = true }
nanus-adapter-local = { workspace = true, optional = true }
nanus-adapter-store = { workspace = true, optional = true }
# The optional `read_video` tool, installed only when the configuration asks for it.
nanus-tool-video = { workspace = true, optional = true }
futures = { workspace = true }
# The process-held key a managed session seals its recall and inspect cursors with.
getrandom = { workspace = true }
serde = { workspace = true }
globset = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# The remembered selection is a small TOML file the configuration's own crate already uses
# this for; a JSON file would be a second format for the same kind of state.
toml = { workspace = true, optional = true }

[dev-dependencies]
base64 = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
image = { workspace = true }

# The live vision checks name the stock adapters and credential stores, so they exist only where
# those do; the minimal runner build must not need them.
[[test]]
name = "live_vision"
required-features = ["stock-compose"]

# Drives every stock adapter's encoder, so it exists only where they do.
[[test]]
name = "resume_across_providers"
required-features = ["stock-compose"]

[lints]
workspace = true
