[package]
name = "nanus-tui"
description = "The interactive terminal interface for nanus: a ratatui chat view over an agent session."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# The view layer builds and tests without the agent runtime, so a contributor can
# work on the interface without a working composition behind it. Leaving the feature
# off keeps the view layer free of tokio and of the adapter crates; the `nanus`
# binary switches it on, because an interface nobody can reach is not an interface.
default = []
# The interactive loop needs a terminal and a harness; the view layer needs neither.
runtime = [
    "dep:nanus-adapter-config",
    "dep:nanus-kernel",
    "dep:nanus-bundle",
    "dep:nanus-ports",
    "dep:tokio",
    "dep:futures",
]

[dependencies]
nanus-adapter-config = { workspace = true, optional = true }
nanus-kernel = { workspace = true, optional = true }
nanus-bundle = { workspace = true, optional = true }
nanus-domain = { workspace = true }
nanus-ports = { workspace = true, optional = true }
ratatui = { workspace = true }
# Only for `StreamExt`, which turns crossterm's `EventStream` into something that can be
# awaited alongside the turn's progress. The rest of the crate needs nothing from it.
futures = { workspace = true, optional = true }
crossterm = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, optional = true, features = ["rt", "macros", "sync", "time"] }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
