[package]
name = "nanus-tui"
description = "The interactive terminal interface for nanus: a ratatui chat view over an agent reached through the local link."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "nanus-tui"
path = "src/main.rs"
# The program is the runtime half plus the view, so it needs the feature that pulls in
# the terminal, the link, and the session store.
required-features = ["runtime"]

[features]
# The interface is a program now, so the runtime is on by default: `cargo build` has to
# produce something a person can run. Leaving it off still builds the view layer alone,
# with no tokio, no link, and no store — which is what a contributor changing the
# rendering wants, and what keeps the view testable without an agent anywhere near it.
default = ["runtime"]
# The interactive loop: a terminal, a link to an agent, and the session store.
runtime = [
    "dep:clap",
    "dep:futures",
    "dep:nanus-adapter-config",
    "dep:nanus-adapter-store",
    "dep:nanus-kernel",
    "dep:nanus-link",
    "dep:nanus-ports",
    "dep:tokio",
]

[dependencies]
# The interface's own display preferences live in the configuration file the core reads,
# so the two programs cannot disagree about how a transcript is drawn. The view layer does
# not link it: the setting is read where the environment is, in the runtime.
nanus-adapter-config = { workspace = true, optional = true }
nanus-adapter-store = { workspace = true, optional = true }
nanus-kernel = { workspace = true, optional = true }
nanus-link = { workspace = true, optional = true }
nanus-ports = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
nanus-domain = { workspace = true }
ratatui = { workspace = true }
# Only for `StreamExt`, which turns crossterm's `EventStream` into something that can be
# awaited alongside the agent's frames. The rest of the crate needs nothing from it.
futures = { workspace = true, optional = true }
crossterm = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The markdown renderer wraps by display width, so it agrees with the terminal about how
# many columns a character takes.
unicode-width = { workspace = true }
tokio = { workspace = true, optional = true, features = [
    "rt",
    "macros",
    "sync",
    "time",
    # The `!` escape runs a child process, and it has to be a *task*: the interface's one thread also
    # carries the link's transport, so a child waited on synchronously would stop a running turn's
    # frames being read.
    "process",
    # And the clipboard is the same argument in the other direction: putting a selection on it is a
    # child process too, so its input is written to a pipe rather than through a blocking call.
    "io-util",
] }

[dev-dependencies]
proptest = { workspace = true }
# A pasted image is written beside the workspace, so the test that stores one needs a directory
# of its own to write into.
tempfile = { workspace = true }

[lints]
workspace = true
